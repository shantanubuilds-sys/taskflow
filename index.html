<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow | Student Productivity</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="container">

        <section class="app">


            <!-- HEADER -->

            <header class="app-header">

                <div>

                    <div class="brand">

                        <span class="brand-icon">
                            ✓
                        </span>

                        <h1>
                            TaskFlow
                        </h1>

                    </div>

                    <p class="subtitle">
                        Organize your day. Get things done.
                    </p>

                </div>


                <div class="task-counter">

                    <span id="taskCount">
                        0
                    </span>

                    <small>
                        Tasks
                    </small>

                </div>

            </header>



            <!-- PRODUCTIVITY DASHBOARD -->

            <section class="dashboard">

                <div class="stat-card">

                    <span class="stat-icon">
                        📋
                    </span>

                    <div>

                        <strong id="totalTasks">
                            0
                        </strong>

                        <span>
                            Total
                        </span>

                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        ⏳
                    </span>

                    <div>

                        <strong id="activeTasks">
                            0
                        </strong>

                        <span>
                            Active
                        </span>

                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        ✅
                    </span>

                    <div>

                        <strong id="completedTasks">
                            0
                        </strong>

                        <span>
                            Completed
                        </span>

                    </div>

                </div>


                <div class="stat-card">

                    <span class="stat-icon">
                        📈
                    </span>

                    <div>

                        <strong id="completionRate">
                            0%
                        </strong>

                        <span>
                            Progress
                        </span>

                    </div>

                </div>

            </section>



            <!-- ADD TASK -->

            <section class="task-form">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    autocomplete="off"
                >


                <div class="task-options">

                    <input
                        type="date"
                        id="dueDate"
                    >


                    <select id="priority">

                        <option value="low">
                            Low Priority
                        </option>

                        <option
                            value="medium"
                            selected
                        >
                            Medium Priority
                        </option>

                        <option value="high">
                            High Priority
                        </option>

                    </select>


                    <button id="addTaskBtn">
                        Add Task
                    </button>

                </div>

            </section>



            <!-- SEARCH -->

            <section class="controls">

                <div class="search-box">

                    <span>
                        🔍
                    </span>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search your tasks..."
                        autocomplete="off"
                    >

                </div>


                <div class="filters">

                    <button
                        class="filter-btn active"
                        data-filter="all"
                    >
                        All
                    </button>

                    <button
                        class="filter-btn"
                        data-filter="active"
                    >
                        Active
                    </button>

                    <button
                        class="filter-btn"
                        data-filter="completed"
                    >
                        Completed
                    </button>

                    <button
                        class="filter-btn"
                        data-filter="high"
                    >
                        High Priority
                    </button>

                </div>

            </section>



            <!-- EMPTY STATE -->

            <div
                id="emptyState"
                class="empty-state"
            >

                <div class="empty-icon">
                    📋
                </div>

                <h2>
                    No tasks yet
                </h2>

                <p>
                    Add your first task and start your day.
                </p>

            </div>


            <!-- NO SEARCH RESULTS -->

            <div
                id="noResults"
                class="empty-state"
                style="display: none;"
            >

                <div class="empty-icon">
                    🔍
                </div>

                <h2>
                    No matching tasks
                </h2>

                <p>
                    Try another search or filter.
                </p>

            </div>



            <!-- TASK LIST -->

            <ul id="taskList"></ul>


        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
