<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | Student Task Manager</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">

        <section class="app">

            <!-- HEADER -->

            <header class="app-header">

                <div>

                    <div class="brand">
                        <span class="brand-icon">✓</span>
                        <h1>TaskFlow</h1>
                    </div>

                    <p class="subtitle">
                        Organize your day. Get things done.
                    </p>

                </div>


                <div class="task-counter">

                    <span id="taskCount">0</span>

                    <small>Tasks</small>

                </div>

            </header>



            <!-- TASK CREATION -->

            <div class="task-form">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    autocomplete="off"
                >


                <div class="task-options">

                    <input
                        type="date"
                        id="dueDate"
                    >


                    <select id="priority">

                        <option value="low">
                            Low Priority
                        </option>

                        <option value="medium" selected>
                            Medium Priority
                        </option>

                        <option value="high">
                            High Priority
                        </option>

                    </select>


                    <button id="addTaskBtn">
                        Add Task
                    </button>

                </div>

            </div>



            <!-- EMPTY STATE -->

            <div id="emptyState" class="empty-state">

                <div class="empty-icon">
                    📋
                </div>

                <h2>No tasks yet</h2>

                <p>
                    Add your first task and start your day.
                </p>

            </div>



            <!-- TASK LIST -->

            <ul id="taskList"></ul>


        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
